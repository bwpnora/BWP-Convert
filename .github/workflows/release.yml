name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated test suite
        run: pnpm test

      - name: Automated Versioning & Tagging
        id: versioning
        shell: pwsh
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          $isMainBranch = ($env:REF -eq 'refs/heads/main')
          $isTag = ($env:REF_TYPE -eq 'tag')

          if ($isTag) {
            $tag = $env:REF_NAME
            Write-Host "Triggered by tag: $tag"
          } elseif ($isMainBranch) {
            $msg = $env:COMMIT_MSG
            $bumpType = "patch"
            if ($msg -match "(?i)^feat") {
              $bumpType = "minor"
            }
            Write-Host "Bumping $bumpType version on main based on commit message: $msg"
            npm version $bumpType --no-git-tag-version

            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "v$($pkg.version)"
            Write-Host "Created tag: $tag"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(release): $tag [skip ci]"
            git tag $tag
            git push origin main
            git push origin $tag
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows installer
        run: pnpm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/checksums.sha256 -Append -Encoding ascii
          }
          Get-Content dist/checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.exe
            dist/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
